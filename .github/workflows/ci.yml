name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch links that rot between pushes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # The weekly schedule also runs on main; its own group keeps it from cancelling a push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer PR push makes the old run pointless; main runs queue so a production deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Lint, format, typecheck, unit
    runs-on: ubuntu-latest
    env:
      # `pnpm typecheck` runs `next typegen`, which loads next.config.ts and validates the env.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # Private terms (client names, regions, postal code, phone) the content guard must never find.
          CLIENT_DENYLIST: ${{ secrets.CLIENT_DENYLIST }}

  build:
    name: Build
    needs: static
    runs-on: ubuntu-latest
    env:
      # Gate jobs build and serve locally; deploy jobs take the real URL from the Vercel project.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
      # The tested build includes /selftest (planted defects for the gate self-tests); deploys don't.
      E2E_SELFTEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm cv
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
            public/cv/
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    env:
      # Gate jobs build and serve locally; deploy jobs take the real URL from the Vercel project.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .
      - run: pnpm exec playwright install --with-deps ${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}
      - run: pnpm test:e2e --project=${{ matrix.project }}
        env:
          # The rendered-HTML and CV integrity checks scan for these private terms too.
          CLIENT_DENYLIST: ${{ secrets.CLIENT_DENYLIST }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/results.json
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    env:
      # Gate jobs build and serve locally; deploy jobs take the real URL from the Vercel project.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs, so a bare Chrome
      # launch aborts with "No usable sandbox". Allow them on this throwaway runner, sandbox kept on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lighthouse CI (budgets in lighthouserc.json)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  links:
    name: Link check
    needs: build
    runs-on: ubuntu-latest
    env:
      # Gate jobs build and serve locally; deploy jobs take the real URL from the Vercel project.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .
      - name: Serve the build for same-origin links
        run: |
          pnpm start -p 3210 &
          npx --yes wait-on@8 http://localhost:3210 --timeout 60000
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --base-url http://localhost:3210 --no-progress '.next/server/app/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-preview:
    name: Preview deploy
    # Same-repository PRs only: forks and Dependabot get no Actions secrets. Runs only when every gate passed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [static, build, e2e, lighthouse, links]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Deploy preview (build here, upload prebuilt)
        id: deploy
        run: pnpm exec bash scripts/vercel-deploy.sh preview
      - name: Smoke and security headers on the preview
        run: pnpm exec playwright test tests/smoke tests/security --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
      - name: Lighthouse on the preview
        run: |
          pnpm exec tsx scripts/lighthouse-remote.ts "$PREVIEW_URL" preview
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun --config=lighthouserc.remote.json
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
      - name: Summary
        if: ${{ !cancelled() && steps.deploy.outputs.url }}
        run: |
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: preview-checks
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  release:
    name: Release
    # Main pushes only. The report is written even when a gate failed (/quality must show failures, never
    # a stale pass), but production is deployed only when every gate passed (D1). A cancelled run is not a
    # verdict on the commit, so it writes nothing.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [static, build, e2e, lighthouse, links]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The write token is not left in .git/config while dependencies install and the deploy runs;
          # the push step supplies it explicitly.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: playwright-*
          path: reports/playwright-raw
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: lighthouse
          path: reports/lighthouse-raw
      - name: Build quality.json
        run: |
          mkdir -p reports/playwright reports/lighthouse
          for dir in reports/playwright-raw/playwright-*; do
            [ -f "$dir/test-results/results.json" ] || continue
            project="${dir##*/playwright-}"
            mkdir -p "reports/playwright/$project"
            cp "$dir/test-results/results.json" "reports/playwright/$project/"
          done
          cp reports/lighthouse-raw/reports/manifest.json reports/lighthouse/ 2>/dev/null || true
          pnpm exec tsx scripts/build-quality-report.ts
        env:
          JOB_RESULTS: >-
            {"static":"${{ needs.static.result }}","build":"${{ needs.build.result }}",
            "e2e":"${{ needs.e2e.result }}","lighthouse":"${{ needs.lighthouse.result }}",
            "links":"${{ needs.links.result }}"}
      - name: Deploy production (with this report and the CV from the same build)
        id: deploy
        if: >-
          needs.static.result == 'success' && needs.build.result == 'success' &&
          needs.e2e.result == 'success' && needs.lighthouse.result == 'success' &&
          needs.links.result == 'success'
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm exec bash scripts/vercel-deploy.sh production
      - name: Smoke and security headers on production
        if: ${{ steps.deploy.outcome == 'success' }}
        run: pnpm exec playwright test tests/smoke tests/security --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.site_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Lighthouse on production
        if: ${{ steps.deploy.outcome == 'success' }}
        run: |
          pnpm exec tsx scripts/lighthouse-remote.ts "$SITE_URL" production
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm exec lhci autorun --config=lighthouserc.remote.json
        env:
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        with:
          name: production-checks
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 30
      - name: Commit the report
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/quality.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(quality): update report [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
